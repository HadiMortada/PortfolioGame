name: Deploy Blind Cube Jev

on:
  push:
    branches: [main]
    paths:
      - "blind-cube-jev/**"
      - ".github/workflows/blind-cube-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "blind-cube-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Blind Cube site
        uses: actions/upload-pages-artifact@v4
        with:
          path: blind-cube-jev
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
